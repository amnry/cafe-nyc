name: ETL

# Biweekly refresh: Google data must not be older than 30 days (cafes_public.is_fresh).
# GitHub cron has no "every 14 days", so run on the 1st and 15th.
on:
  schedule:
    - cron: "0 9 1,15 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes to Supabase)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      - name: Tests
        run: python -m pytest etl/tests
      - name: Refresh existing cafes
        # Scheduled runs always write; manual runs write only when dry_run is unchecked.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python etl/run.py --all-existing --dry-run
          else
            python etl/run.py --all-existing --write
          fi
